adius:20px;background:#241c2c7a;text-align:center;padding:38px 22px;max-width:720px;margin:auto}.empty .em{font-size:36px}.empty h3{margin:12px 0 7px}.empty p{color:var(--muted);line-height:1.6;font-size:13px}.intro{margin:0 0 21px;color:var(--muted);max-width:800px;line-height:1.6;font-size:13px}.panel{border:1px solid var(--line);background:linear-gradient(135deg,#201a2d,#16141e);border-radius:17px;padding:19px;margin-bottom:15px}.panel h3{font-size:16px;margin:0 0 10px}.panel p,.help{color:var(--muted);font-size:13px;line-height:1.6}.field{margin:0 0 15px}.field label{display:block;color:#d6c6df;font-weight:700;font-size:12px;margin:0 0 8px}.field input,.field textarea,.field select,.chat-select{width:100%;background:#110f1b;border:1px solid #554362;border-radius:11px;outline:none;color:#fff;padding:12px;min-height:44px}.field textarea{min-height:110px;resize:vertical;line-height:1.55}.field input:focus,.field textarea:focus,.field select:focus{border-color:#c797ea;box-shadow:0 0 0 2px #9155d62b}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.hint{color:var(--muted);font-size:11px}.memory-item{display:flex;align-items:flex-start;gap:12px;padding:13px 0;border-bottom:1px solid #352a41}.memory-item:last-child{border:0}.memorytext{flex:1;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.memorymeta{color:var(--muted);font-size:10px;margin-top:5px}.memorybuttons{display:flex;gap:5px;align-items:center}.memorybuttons button{border:0;background:#332940;color:var(--muted);border-radius:8px;padding:7px 9px}.memorybuttons .pin{color:#e4b2ff}.chat-shell{display:flex;flex-direction:column;flex:1;min-height:0}.chat-head{display:flex;align-items:center;justify-content:space-between;padding:15px 28px;border-bottom:1px solid var(--line);gap:12px}.chat-head-left{display:flex;align-items:center;gap:12px;min-width:0}.chat-head .avatar{height:41px;width:41px;font-size:17px;flex:none}.chat-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chat-mid{overflow:auto;flex:1;padding:26px min(5vw,70px);display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth}.message{max-width:min(88%,710px);display:flex;flex-direction:column;gap:5px}.message.user{align-self:flex-end}.message.bot{align-self:flex-start}.message .bubble{border:1px solid #463452;background:#21192b;padding:14px 17px;border-radius:17px 17px 17px 5px;line-height:1.7;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}.message.user .bubble{border:1px solid #8963ac;background:linear-gradient(135deg,#513369,#3f2c58);border-radius:17px 17px 5px 17px}.message .speaker{font-size:10px;color:var(--muted);padding:0 5px}.message.user .speaker{text-align:right}.compose-wrap{border-top:1px solid var(--line);background:#171322;padding:13px min(5vw,70px) max(17px,env(safe-area-inset-bottom))}.compose{display:flex;align-items:flex-end;gap:8px;max-width:900px;margin:auto}.compose textarea{flex:1;max-height:144px;min-height:48px;resize:vertical;background:#261e32;border:1px solid #51405f;border-radius:15px;padding:13px;color:var(--text);outline:0;line-height:1.5}.send{background:var(--accent2);color:#160b20;border:0;border-radius:14px;padding:14px 16px;min-height:48px;font-weight:900}.compose-note{text-align:center;color:var(--muted);font-size:10px;margin-top:8px}.toast{position:fixed;right:24px;bottom:25px;background:#372947;border:1px solid #9675b4;color:white;border-radius:14px;padding:12px 16px;max-width:380px;box-shadow:0 15px 35px #0007;z-index:99;font-size:13px;display:none}.toast.show{display:block}.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:15px;background:#08050edb;backdrop-filter:blur(7px)}.modal.open{display:flex}.modal-dialog{width:min(600px,100%);max-height:90dvh;overflow:auto;background:#20192e;border:1px solid #5c4772;border-radius:22px;padding:23px}.modal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-top h2{margin:0}.mobilebar{display:none}.tabrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:15px}.note{padding:12px 14px;border:1px solid #4b3861;border-radius:12px;background:#32253c;color:#ddd0e9;font-size:12px;line-height:1.6;margin-bottom:15px}.code{font-family:ui-monospace,monospace;font-size:12px;background:#0d0b14;color:#eecbff;padding:1px 5px;border-radius:5px}.progress{height:7px;background:#32273b;border-radius:8px;overflow:hidden;margin:9px 0}.progress>div{height:100%;background:linear-gradient(90deg,#ac75df,#e6a0df);width:0}.mini{font-size:11px;color:var(--muted)}.config-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.selected{border-color:#b680e9!important}.hide{display:none!important}
@media(max-width:800px){.app{display:block}.sidebar{display:none}.topbar{padding:11px 17px;min-height:65px}.topbar h1{font-size:17px}.topbar .status{padding:7px 9px;max-width:47%;font-size:10px}.body{padding:20px 15px 108px}.section-title h2{font-size:21px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.char-card{min-height:170px;padding:14px}.char-card p{font-size:11px}.mobilebar{position:fixed;bottom:0;left:0;right:0;z-index:15;display:grid;grid-template-columns:repeat(4,1fr);background:#1b1527;border-top:1px solid #493853;padding:7px 3px max(9px,env(safe-area-inset-bottom));box-shadow:0 -10px 22px #0002}.mobilebar button{background:none;border:0;color:#c0afcb;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 2px;font-size:10px}.mobilebar button.active{color:#e3b7ff}.mobilebar button span{font-size:20px}.chat-head{padding:10px 15px}.chat-mid{padding:16px 13px;padding-bottom:22px}.message{max-width:92%}.message .bubble{font-size:13px;padding:12px 14px}.compose-wrap{padding:9px 12px calc(74px + env(safe-area-inset-bottom))}.compose textarea{min-height:44px;padding:11px}.send{min-height:44px;padding:11px}.compose-note{display:none}.fields,.config-grid{grid-template-columns:1fr}.modal-dialog{padding:17px}.toast{right:9px;bottom:87px;left:9px;max-width:none}}

<body>
<div class="app"><aside class="sidebar"><div class="brand"><div class="brandicon">✦</div><div><div class="brandname">StoryVault</div><small>YOUR STORIES. YOUR MEMORY.</small></div></div><nav class="nav" id="sidenav"><button data-view="chats">▦ &nbsp;Characters & chats</button><button data-view="memories">◈ &nbsp;Memory vault</button><button data-view="import">⇩ &nbsp;Import stories</button><button data-view="settings">⚙ &nbsp;AI & settings</button></nav><div class="side-foot">Stored on this device · Export backups often<br>Independent project, not affiliated with SpicyChat.</div></aside><main class="content" id="content"></main></div>
<nav class="mobilebar" id="mobilebar"><button data-view="chats"><span>▦</span>Chats</button><button data-view="memories"><span>◈</span>Memory</button><button data-view="import"><span>⇩</span>Import</button><button data-view="settings"><span>⚙</span>Settings</button></nav>
<div class="modal" id="modal" role="dialog" aria-modal="true"><div class="modal-dialog" id="modalcontent"></div></div><div class="toast" id="toast" role="status"></div>
<script>
'use strict';
const DB_NAME='storyvault_v1', DB_KEY='app_state';
const uid=()=> (globalThis.crypto?.randomUUID?.() || Date.now().toString(36)+Math.random().toString(36).slice(2));
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const trim=(t,n)=>String(t||'').length>n?String(t).slice(0,n)+'…':String(t||'');
const defaultSettings={mode:'ondevice',model:'Llama-3.2-1B-Instruct-q4f16_1-MLC',endpoint:'http://127.0.0.1:1234/v1/chat/completions',apiModel:'local-model',apiKey:''};
let app={version:1,characters:[],activeId:null,settings:{...defaultSettings}};let view='chats', db, engine=null, engineModel='', busy=false, loadMessage='', workBusy=false, toastTimer;
function defaultChar(name='New character'){return{id:uid(),name,description:'',world:'',greeting:'',messages:[],memories:[],summaries:[],summarizedThrough:0,createdAt:Date.now()};}
function active(){return app.characters.find(c=>c.id===app.activeId)||null;}
function normalizeChar(c){return{...defaultChar(),...c,id:c.id||uid(),messages:Array.isArray(c.messages)?c.messages:[],memories:Array.isArray(c.memories)?c.memories:[],summaries:Array.isArray(c.summaries)?c.summaries:[],summarizedThrough:Number(c.summarizedThrough)||0};}
async function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=()=>{req.result.createObjectStore('main')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function write(){if(!db)return;const snapshot=structuredClone(app);return new Promise((resolve,reject)=>{const tx=db.transaction('main','readwrite');tx.objectStore('main').put(snapshot,DB_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)})}
async function read(){return new Promise((resolve,reject)=>{const tx=db.transaction('main','readonly');const req=tx.objectStore('main').get(DB_KEY);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function alertToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),4200)}
const icon=(c)=>Array.from(c.name||'?')[0]?.toUpperCase()||'?';
function status(){const ok=app.settings.mode==='ondevice'?!!engine:!!app.settings.endpoint;const msg=loadMessage||(app.settings.mode==='ondevice'?(engine?'On-device AI ready':'On-device AI not loaded'):'External endpoint configured');return `<div class="status" title="${esc(msg)}"><span class="dot ${ok?'good':''}"></span><span style="overflow:hidden;text-overflow:ellipsis">${esc(trim(msg,42))}</span></div>`}
function heading(title,subtitle,actions=''){return `<header class="topbar"><div><h1>${esc(title)}</h1><div class="subtitle">${esc(subtitle)}</div></div>${actions||status()}</header>`}
function setNav(){for(const b of document.querySelectorAll('[data-view]'))b.classList.toggle('active',b.dataset.view===view)}
function switchView(v){view=v;render();}
function render(){setNav();const root=document.getElementById('content');root.innerHTML=view==='chats'?renderChats():view==='chat'?renderChat():view==='memories'?renderMemories():view==='import'?renderImport():renderSettings();if(view==='chat'){const m=document.getElementById('chatmid');if(m)m.scrollTop=m.scrollHeight;}}
function renderChats(){return heading('Your characters','Independent roleplay. Memories that stay.')+`<div class="body"><div class="section-title"><h2>Characters <span class="pill">${app.characters.length}</span></h2><button class="btn primary" data-act="new">+ New character</button></div>${app.characters.length?`<div class="grid">${app.characters.map(c=>`<button class="char-card" data-open="${esc(c.id)}"><div class="avatar">${esc(icon(c))}</div><div><h3>${esc(c.name)}</h3><p>${esc(c.description||'Add a backstory and personality for your character.')}</p></div><div class="char-foot"><span>${c.messages.length} messages</span><span>${c.memories.length} memories</span></div></button>`).join('')}</div>`:`<div class="empty"><div class="em">✦</div><h3>Give your next story a home</h3><p>Create a character from scratch, or import a conversation to pick up the story where you left off.</p><div class="actions" style="justify-content:center"><button class="btn primary" data-act="new">Create a character</button><button class="btn" data-view="import">Import a conversation</button></div></div>`}<div class="panel" style="margin-top:20px"><h3>Designed for long-running stories</h3><p>Full chat logs stay saved on this device. Pinned facts, searchable memories, and story summaries are included in the prompts sent to your AI. You can export everything into a portable backup.</p></div></div>`}
function renderChat(){let c=active();if(!c){view='chats';return renderChats()};return `<div class="chat-shell"><div class="chat-head"><div class="chat-head-left"><button class="btn small ghost" data-view="chats" aria-label="Back to characters">←</button><div class="avatar">${esc(icon(c))}</div><div style="min-width:0"><div class="chat-name">${esc(c.name)}</div><div class="mini">${c.messages.length} messages · ${c.memories.length} memories</div></div></div><div class="actions"><button class="btn small" data-act="characterEdit">Edit</button><button class="btn small" data-view="memories">Memory</button><button class="btn small" data-act="chatExport">↧</button></div></div><div class="chat-mid" id="chatmid">${c.messages.length?c.messages.map(m=>`<div class="message ${m.role==='user'?'user':'bot'}"><div class="speaker">${m.role==='user'?'You':esc(c.name)}</div><div class="bubble">${esc(m.content)}</div></div>`).join(''):`<div class="empty"><div class="em">✧</div><h3>${esc(c.name)} is ready</h3><p>${esc(c.greeting||'Write the opening scene or import an existing conversation. All your messages will be saved.')}</p></div>`}</div><div class="compose-wrap"><div class="compose"><textarea id="msg" rows="1" placeholder="Continue your story…" ${busy?'disabled':''}></textarea><button class="send" id="send" data-act="send" ${busy?'disabled':''}>${busy?'…':'➤'}</button></div><div class="compose-note">${busy?'Generating response…':'If AI is not connected, your message is saved until you retry.'} ${c.messages.length&&c.messages.at(-1)?.role==='user'?'<button class="btn small ghost" data-act="retry">Retry response</button>':''}</div></div></div>`}
function renderMemories(){const c=active();return heading('Memory vault','Important facts and story history — under your control')+`<div class="body"><div class="section-title"><h2>Long-term memory</h2><button class="btn" data-act="backup">↧ Export backup</button></div>${!app.characters.length?`<div class="empty"><p>Create or import a character first.</p><button class="btn primary" data-view="chats">Go to characters</button></div>`:`<div class="field"><label>Character</label><select id="memchar" class="chat-select">${app.characters.map(x=>`<option value="${esc(x.id)}" ${x.id===app.activeId?'selected':''}>${esc(x.name)}</option>`).join('')}</select></div>${c?`<div class="panel"><div class="section-title"><h2 style="font-size:16px">Permanent facts <span class="pill">${c.memories.length}</span></h2><button class="btn primary small" data-act="addMemory">+ Add fact</button></div><p class="help">Pin the most important facts. Pinned memories are always included in the AI prompt. Other facts are selected by relevance.</p>${c.memories.length?c.memories.map(m=>`<div class="memory-item"><div style="font-size:17px">${m.pinned?'📌':'◦'}</div><div class="memorytext">${esc(m.text)}<div class="memorymeta">${esc(m.source||'Manual')} ${m.pinned?' · Always included':''}</div></div><div class="memorybuttons"><button class="pin" data-mem="${esc(m.id)}" data-act="togglePin" title="Pin or unpin">${m.pinned?'Unpin':'Pin'}</button><button data-mem="${esc(m.id)}" data-act="editMemory" title="Edit">✎</button><button data-mem="${esc(m.id)}" data-act="deleteMemory" title="Delete">×</button></div></div>`).join(''):'<p class="help">No permanent memories yet. Add names, relationships, promises, or canon details here.</p>'}</div><div class="panel"><div class="section-title"><h2 style="font-size:16px">Story summaries <span class="pill">${c.summaries.length}</span></h2><button class="btn small" data-act="buildMemory" ${workBusy?'disabled':''}>${workBusy?'Building…':'✦ Build from chat'}</button></div><p class="help">Build summaries in small batches using your configured AI. The app stores them and retrieves relevant parts later. Imported messages stay intact; this does not delete history.</p><div class="mini">Processed ${Math.min(c.summarizedThrough,c.messages.length)} / ${c.messages.length} messages</div><div class="progress"><div style="width:${c.messages.length?Math.round(Math.min(100,100*c.summarizedThrough/c.messages.length)):0}%"></div></div>${c.summaries.slice().reverse().map(s=>`<div class="memory-item"><div class="memorytext">${esc(s.text)}<div class="memorymeta">Messages ${s.from+1}–${s.to}</div></div><button class="btn small ghost" data-sum="${esc(s.id)}" data-act="deleteSummary">×</button></div>`).join('')||'<p class="help">No summaries yet. Load an AI model (or connect an endpoint), then tap Build from chat.</p>'}</div>`:''}`}</div>`}
function renderImport(){return heading('Import a conversation','Continue an existing story without starting over')+`<div class="body"><div class="section-title"><h2>Bring your story over</h2><span class="pill">TXT / JSON</span></div><div class="note"><strong>About SpicyChat:</strong> This tool imports files and text you have legitimately saved or copied. It does not log in to SpicyChat or unlock restricted features. Chat export formats vary, so some JSON files may need adjustment.</div><div class="panel"><h3>1. Choose the destination</h3><div class="field"><label>Character</label><select id="importchar"><option value="new">+ Create a character from this story</option>${app.characters.map(c=>`<option value="${esc(c.id)}">${esc(c.name)} (append messages)</option>`).join('')}</select></div><div class="field"><label>New character's name (when creating)</label><input id="importname" placeholder="e.g., Maya" maxlength="90" /></div><h3>2. Supply your transcript</h3><div class="field"><label>Upload a saved .txt, .md, or .json file</label><input type="file" id="importfile" accept=".txt,.md,.json,text/plain,application/json" /></div><div class="field"><label>Or paste conversation text</label><textarea id="importtext" rows="11" placeholder="You: We met in the bookstore last winter.&#10;Maya: I remember it like yesterday.&#10;You: Do you still have the letter?&#10;Maya: Of course I do."></textarea></div><div class="actions"><button class="btn primary" data-act="import">Import messages</button><span class="hint">Uses the file if supplied; otherwise uses pasted text.</span></div></div><div class="panel"><h3>Supported formats</h3><p>Alternating speaker transcripts like <span class="code">You: …</span> and <span class="code">Maya: …</span>; common JSON <span class="code">messages</span> arrays; and StoryVault backup exports. If you have a different SpicyChat export, importing a sample may reveal what format support we need to add.</p></div></div>`}
function renderSettings(){const s=app.settings;return heading('AI & settings','No subscription required when running your own model')+`<div class="body"><div class="section-title"><h2>Choose your AI</h2><span class="pill">Your choice</span></div><p class="intro">The chat interface and memory vault work independently of any AI provider. To generate actual character replies, you must load a compatible local AI model or supply an API endpoint. Neither method requires a StoryVault subscription.</p><div class="config-grid"><div class="panel ${s.mode==='ondevice'?'selected':''}"><h3>📱 On-device AI (experimental)</h3><p>Try running a smaller WebLLM model in your phone's browser. Needs compatible WebGPU and a large first-time model download; some Android GPUs fail.</p><label><input type="radio" name="mode" value="ondevice" ${s.mode==='ondevice'?'checked':''}/> Select on-device AI</label></div><div class="panel ${s.mode==='endpoint'?'selected':''}"><h3>🖥️ Compatible AI endpoint</h3><p>Connect a locally hosted model (for example, an OpenAI-compatible server on your computer or phone). This requires network access to that server.</p><label><input type="radio" name="mode" value="endpoint" ${s.mode==='endpoint'?'checked':''}/> Select endpoint</label></div></div><div class="panel ${s.mode==='ondevice'?'':'hide'}"><h3>Load a phone AI model</h3><div class="field"><label>Model</label><select id="model"><option value="Llama-3.2-1B-Instruct-q4f16_1-MLC" ${s.model==='Llama-3.2-1B-Instruct-q4f16_1-MLC'?'selected':''}>Llama 3.2 1B · lighter download</option><option value="Llama-3.2-3B-Instruct-q4f16_1-MLC" ${s.model==='Llama-3.2-3B-Instruct-q4f16_1-MLC'?'selected':''}>Llama 3.2 3B · heavier, may not fit</option></select></div><div class="actions"><button class="btn primary" id="load-model" data-act="loadModel" ${busy?'disabled':''}>${engine?'Reload model':'Download & load AI'}</button><span id="loadstatus" class="hint">${esc(loadMessage||'Internet needed for initial download. Browser compatibility not guaranteed.')}</span></div><p class="help">On Android Chrome this is experimental. An installed native local-AI app can be more reliable than browser-based WebGPU. Downloaded model files are cached by the browser when supported, but can be removed by clearing site data.</p></div><div class="panel ${s.mode==='endpoint'?'':'hide'}"><h3>AI endpoint connection</h3><div class="field"><label>Chat Completions URL</label><input id="endpoint" value="${esc(s.endpoint)}" placeholder="http://localhost:1234/v1/chat/completions"></div><div class="field"><label>Model name at endpoint</label><input id="apiModel" value="${esc(s.apiModel)}"></div><div class="field"><label>API key (leave empty for local services)</label><input id="apiKey" type="password" value="${esc(s.apiKey)}"></div><div class="actions"><button class="btn primary" data-act="saveEndpoint">Save connection</button></div><p class="help">This mode transmits chat context and selected memories to the endpoint you configure. Only use a server you trust. Cross-origin access (CORS), HTTPS restrictions and the server's model capabilities may require configuration.</p></div><div class="panel"><h3>Data & backup</h3><p>Everything in this app is saved locally in this browser's IndexedDB. The data is not encrypted. It can disappear if browser site data is deleted or your browser evicts storage, so export regular backups.</p><div class="actions"><button class="btn" data-act="backup">↧ Export all chats & memories</button><button class="btn" data-act="restore">↥ Restore backup</button><button class="btn danger" data-act="clearAll">Erase local data</button></div><input type="file" accept="application/json,.json" id="restorefile" style="display:none"></div><div class="panel"><h3>About this version</h3><p>StoryVault v1 — independent prototype, not affiliated with SpicyChat. Current memory design: pinned facts + relevance-matched facts + AI-authored chunk summaries + recent transcript. This improves continuity but cannot promise flawless recall. Importing doesn't automatically recover inaccessible or deleted chat history.</p></div></div>`}

function charDialog(c){const isEdit=!!c;c=c||defaultChar();modal(isEdit?'Edit character':'Create character',`<form id="characterForm"><div class="field"><label>Name</label><input name="name" maxlength="90" required value="${esc(c.name==='New character'&&!isEdit?'':c.name)}" placeholder="Character name" /></div><div class="field"><label>Personality and background</label><textarea name="description" placeholder="Personality, appearance, speaking style, relationship with you…">${esc(c.description)}</textarea></div><div class="field"><label>World, setting, and story rules</label><textarea name="world" placeholder="Where the story takes place, important setting details…">${esc(c.world)}</textarea></div><div class="field"><label>Opening scene (optional)</label><textarea name="greeting" placeholder="The starting situation…">${esc(c.greeting)}</textarea></div><div class="actions"><button class="btn primary" type="submit">${isEdit?'Save character':'Create character'}</button>${isEdit?`<button class="btn danger" type="button" data-act="deleteCharacter">Delete character</button>`:''}</div></form>`);document.getElementById('characterForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);if(isEdit){c.name=String(f.get('name')).trim();c.description=String(f.get('description'));c.world=String(f.get('world'));c.greeting=String(f.get('greeting'))}else{const fresh=defaultChar(String(f.get('name')).trim());fresh.description=String(f.get('description'));fresh.world=String(f.get('world'));fresh.greeting=String(f.get('greeting'));app.characters.unshift(fresh);app.activeId=fresh.id;view='chat'}await write();closeModal();render();alertToast(isEdit?'Character updated':'Character created')};}
function memoryDialog(id){const c=active();if(!c)return;const m=c.memories.find(x=>x.id===id);modal(m?'Edit memory':'Add permanent memory',`<form id="memoryForm"><div class="field"><label>Fact, relationship, promise, or story canon</label><textarea name="text" required maxlength="4000" placeholder="Maya and I adopted Max, a golden retriever, in August.">${esc(m?.text||'')}</textarea></div><label style="display:block;margin-bottom:17px;font-size:13px"><input type="checkbox" name="pinned" ${m?.pinned?'checked':''}> Pin: always include in AI context</label><button class="btn primary" type="submit">Save memory</button></form>`);document.getElementById('memoryForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);const text=String(f.get('text')).trim();if(!text)return;const pin=f.get('pinned')==='on';if(m){m.text=text;m.pinned=pin}else c.memories.push({id:uid(),text,pinned:pin,source:'Manual',createdAt:Date.now()});await write();closeModal();render();alertToast('Memory saved')};}
function download(name,content,type='application/json'){const b=new Blob([content],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000)}
function backup(){const safe=structuredClone(app);safe.settings.apiKey='';download('storyvault-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'storyvault-backup',exportedAt:new Date().toISOString(),app:safe},null,2))}
function chatExport(){const c=active();if(!c)return;download('storyvault-'+slug(c.name)+'.json',JSON.stringify({format:'storyvault-character',character:c},null,2))}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,35)||'character'}
function getRole(item,name){const r=String(item.role??item.sender??item.author??item.speaker??item.name??item.type??'').trim().toLowerCase();if(typeof item.is_user==='boolean')return item.is_user?'user':'assistant';if(['user','human','you','me','player','self'].includes(r))return'user';if(['assistant','ai','bot','character','model','gpt'].includes(r))return'assistant';if(name&&r===name.toLowerCase())return'assistant';if(r&&r!=='system')return'assistant';return null}
function msgText(x){const value=x.content??x.text??x.message??x.body??x.value;if(typeof value==='string')return value;if(Array.isArray(value))return value.map(v=>typeof v==='string'?v:v?.text??v?.content??'').join('\n');if(value&&typeof value==='object')return typeof value.text==='string'?value.text:'';return ''}
function parseJsonTranscript(v,characterName=''){if(Array.isArray(v)){const arr=v.map(o=>{if(!o||typeof o!=='object')return null;const role=getRole(o,characterName),content=msgText(o);return role&&content?{id:uid(),role,content,ts:Date.now()}:null}).filter(Boolean);if(arr.length)return{messages:arr};}if(v&&typeof v==='object'){if(v.format==='storyvault-backup'||v.format==='storyvault-character')return {backup:v};const variants=[v.messages,v.chat,v.history,v.conversation,v.data?.messages,v.data?.chat,v.chat_history,v.chatHistory];for(const a of variants){if(Array.isArray(a)){const p=parseJsonTranscript(a,characterName||v.name||v.character?.name||'');if(p.messages?.length)return {...p,characterName:v.character_name||v.character?.name||v.name||''}}}if(v.character&&Array.isArray(v.character.messages))return{backup:{format:'storyvault-character',character:v.character}};}return{messages:[]};}
function parsePlainTranscript(text,characterName=''){const lines=String(text).replace(/\r\n/g,'\n').split('\n');const out=[];let current=null;const knownUser=/^(you|user|me|human|player|{{user}})$/i;const knownBot=/^(assistant|ai|bot|character|{{char}})$/i;const marker=/^\s*(?:\[(.{1,55})\]|\*\*(.{1,55})\*\*|([^:\n]{1,55}))\s*[:：]\s*(.*)$/;for(const line of lines){let match=line.match(marker);let who=(match&&(match[1]||match[2]||match[3])||'').trim();let looksSpeaker=!!(match&&who&&!/^\d/.test(who)&&!/[.!?]/.test(who)&& (knownUser.test(who)||knownBot.test(who)|| (characterName&&who.toLowerCase()===characterName.toLowerCase())||(!who.includes(' ')&&who.length<25)));if(looksSpeaker){if(current&&current.content.trim())out.push(current);current={id:uid(),role:knownUser.test(who)?'user':'assistant',content:match[4],ts:Date.now()};}else if(current){current.content+='\n'+line;}else if(line.trim()){} }if(current&&current.content.trim())out.push(current);return{messages:out};}
function parseInput(text,filename='',charName=''){const isJson=filename.toLowerCase().endsWith('.json')||/^[\s]*[\[{]/.test(text);if(isJson){try{const obj=JSON.parse(text);const p=parseJsonTranscript(obj,charName);if(p.messages?.length||p.backup)return p}catch(e){if(filename.toLowerCase().endsWith('.json'))throw Error('JSON could not be parsed or no supported messages were found.')}}const p=parsePlainTranscript(text,charName);if(p.messages.length)return p;throw Error('No alternating speaker messages detected. Use labels such as "You:" and "CharacterName:" at the start of each turn.');}
function stopwords(t){return new Set(String(t).toLowerCase().match(/[a-z0-9]{3,}/g)?.filter(x=>!['the','and','you','your','that','this','with','from','have','they','them','when','were','been','about','would','could','there','their','what','just','into','said','then','will','shall','does','which','ours','hers','his','its','was','for','are','but','not','our','she','him','how'].includes(x))||[])}
function relevance(text,query){const a=stopwords(text),b=stopwords(query);let matches=0;for(const w of b)if(a.has(w))matches++;return matches/(1+Math.sqrt(a.size));}
function buildPrompt(c,nextUser){
 const system=`You are roleplaying as ${c.name}. Remain in character unless the user explicitly requests out-of-character discussion.\nCHARACTER PERSONALITY AND BACKGROUND:\n${trim(c.description,1500)||'Adapt naturally to the established dialogue.'}\nSETTING AND CANON:\n${trim(c.world,1300)||'Follow the established story.'}\nThe supplied facts and earlier story summaries represent established continuity. Respect the order of events. Do not contradict established facts or confidently invent supposedly remembered details. Advance the story naturally.`;
 const pinned=c.memories.filter(m=>m.pinned).slice(-15);
 const unpinned=c.memories.filter(m=>!m.pinned).map(m=>({...m,score:relevance(m.text,nextUser)})).sort((a,b)=>b.score-a.score).slice(0,8);
 const selectedMem=[];let memBudget=2400;
 for(const m of [...pinned,...unpinned]){const item='- '+trim(m.text,360);if(item.length>memBudget)continue;selectedMem.push(item);memBudget-=item.length;}
 const recentSumm=c.summaries.slice(-2);
 const relevantSumm=c.summaries.map(s=>({...s,score:relevance(s.text,nextUser)})).sort((a,b)=>b.score-a.score).slice(0,4);
 const seen=new Set();let summaryBudget=2000;
 const selectedSumm=[];
 for(const x of [...recentSumm,...relevantSumm]){if(seen.has(x.id))continue;seen.add(x.id);const item=`[Messages ${x.from+1}-${x.to}] ${trim(x.text,750)}`;if(item.length>summaryBudget)continue;selectedSumm.push(x);summaryBudget-=item.length;}
 selectedSumm.sort((a,b)=>a.from-b.from);
 const summary=selectedSumm.map(x=>`[Messages ${x.from+1}-${x.to}] ${trim(x.text,750)}`).join('\n');
 const messages=[{role:'system',content:system+'\n\nPERMANENT MEMORIES:\n'+(selectedMem.join('\n')||'None yet')+'\n\nPRIOR STORY SUMMARY:\n'+(summary||'Not summarized yet')}];
 let chatBudget=4900;const recent=[];
 for(const m of c.messages.slice(-14).reverse()){const content=trim(m.content,850);if(content.length>chatBudget)break;recent.unshift({role:m.role==='user'?'user':'assistant',content});chatBudget-=content.length;}
 return messages.concat(recent);
}
async function callAI(messages){if(app.settings.mode==='ondevice'){if(!engine)throw Error('On-device AI not loaded. Open Settings and tap Download & load AI.');const r=await engine.chat.completions.create({messages,temperature:0.8,max_tokens:550});return r.choices?.[0]?.message?.content?.trim()||'';}const s=app.settings;const ctrl=new AbortController();const timer=setTimeout(()=>ctrl.abort(),180000);try{const res=await fetch(s.endpoint,{method:'POST',headers:{'Content-Type':'application/json',...(s.apiKey?{'Authorization':'Bearer '+s.apiKey}:{})},body:JSON.stringify({model:s.apiModel,messages,temperature:.8,max_tokens:550,stream:false}),signal:ctrl.signal});if(!res.ok)throw Error('AI endpoint returned '+res.status);const dat=await res.json();const reply=dat.choices?.[0]?.message?.content;if(typeof reply!=='string')throw Error('Endpoint did not return a chat completion.');return reply.trim();}finally{clearTimeout(timer)}}
async function loadModel(){if(busy)return;if(!navigator.gpu){alertToast('WebGPU is unavailable in this browser. Use a compatible Android local-AI app or the endpoint mode.');return;}busy=true;loadMessage='Preparing model library…';render();try{const webllm=await import('https://esm.run/@mlc-ai/web-llm');const model=app.settings.model;const next=await webllm.CreateMLCEngine(model,{initProgressCallback:p=>{loadMessage=p.text||'Loading AI model…';const st=document.getElementById('loadstatus');if(st)st.textContent=loadMessage;const top=document.querySelector('.status span:last-child');if(top)top.textContent=trim(loadMessage,42)}});engine=next;engineModel=model;loadMessage='Model ready';alertToast('On-device AI loaded. You can chat now.')}catch(e){loadMessage='Model failed: '+String(e.message||e).slice(0,100);alertToast(loadMessage)}finally{busy=false;render()}}
async function generateReply(){const c=active();if(!c||busy||c.messages.at(-1)?.role!=='user')return;busy=true;render();try{const text=await callAI(buildPrompt(c,c.messages.at(-1).content));if(!text)throw Error('The AI returned an empty reply.');c.messages.push({id:uid(),role:'assistant',content:text,ts:Date.now()});await write();render();if(!workBusy&&c.messages.length-c.summarizedThrough>=40){summarizeBatch(1,true).catch(()=>{})}}catch(e){alertToast('Cannot generate: '+String(e.message||e).slice(0,180));}finally{busy=false;render()}}
async function send(){const box=document.getElementById('msg');const text=box?.value.trim();if(!text||busy)return;const c=active();if(!c)return;c.messages.push({id:uid(),role:'user',content:text,ts:Date.now()});await write();render();if(app.settings.mode==='ondevice'&&!engine){alertToast('Message saved. Load on-device AI in Settings, then tap Retry response.');return;}await generateReply();}
async function summarizeBatch(limit=8,silent=false){const c=active();if(!c||workBusy)return;workBusy=true;try{let count=0;while(c.summarizedThrough<c.messages.length&&count<limit){const from=c.summarizedThrough,to=Math.min(from+32,c.messages.length);if(to-from<6&&silent)break;const transcript=c.messages.slice(from,to).map(m=>(m.role==='user'?'User':c.name)+': '+trim(m.content,550)).join('\n');const request=[{role:'system',content:'You summarize sections of fictional roleplay transcripts for persistent long-term memory. Only record events, names, commitments, relationship changes, locations, important objects and unresolved plot points actually established in the text. Preserve chronology. No speculation. Do not roleplay. Return a compact but informative summary, maximum 160 words.'},{role:'user',content:transcript.slice(0,8500)}];const summary=(await callAI(request)).trim();if(!summary)throw Error('AI returned no summary');c.summaries.push({id:uid(),from,to,text:summary,createdAt:Date.now()});c.summarizedThrough=to;await write();count++;if(!silent){render();await new Promise(r=>setTimeout(r,30))}}if(!silent)alertToast(count?`Summarized ${count} story section${count>1?'s':''}.`:'Everything has already been summarized.')}catch(e){if(!silent)alertToast('Summary failed: '+String(e.message||e).slice(0,150))}finally{workBusy=false;if(!silent||view==='memories')render()}}
async function importConversation(){let file=document.getElementById('importfile')?.files[0];let text=file?await file.text():document.getElementById('importtext')?.value||'';if(!text.trim()){alertToast('Choose a file or paste a transcript first.');return}const name=document.getElementById('importname')?.value.trim()||'';let p;try{p=parseInput(text,file?.name||'',name)}catch(e){alertToast(String(e.message||e));return}if(p.backup){const b=p.backup;if(b.format==='storyvault-character'&&b.character){const c=normalizeChar(b.character);c.id=uid();app.characters.unshift(c);app.activeId=c.id;view='chat';await write();render();alertToast('Character and chat imported.');return;}if(b.format==='storyvault-backup'&&b.app){if(!confirm('Restore this StoryVault backup? This replaces the current characters and settings. Export your existing backup first.'))return;await restoreBackup(b);return}}
const dest=document.getElementById('importchar').value;let c;if(dest==='new'){c=defaultChar(name||p.characterName||(file?.name?.replace(/\.(txt|md|json)$/i,'')||'Imported character'));app.characters.unshift(c)}else{c=app.characters.find(x=>x.id===dest);if(!c)return;}const prev=c.messages.length;c.messages.push(...p.messages);app.activeId=c.id;view='chat';await write();render();alertToast(`Imported ${p.messages.length} messages${prev?' (appended)':''}. Add pinned canon facts in Memory.`);}
async function restoreBackup(b){if(!b?.app||!Array.isArray(b.app.characters))throw Error('Not a StoryVault backup.');app={version:1,characters:b.app.characters.map(normalizeChar),activeId:b.app.activeId,settings:{...defaultSettings,...b.app.settings,apiKey:''}};if(!app.characters.some(c=>c.id===app.activeId))app.activeId=app.characters[0]?.id||null;engine=null;view='chats';await write();render();alertToast('Backup restored. API key was not restored for privacy.')}
async function handleActions(e){const vb=e.target.closest('[data-view]');if(vb){switchView(vb.dataset.view);return}const cb=e.target.closest('[data-open]');if(cb){app.activeId=cb.dataset.open;view='chat';await write();render();return}const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act,c=active();switch(act){case'new':charDialog(null);break;case'characterEdit':if(c)charDialog(c);break;case'closeModal':closeModal();break;case'addMemory':memoryDialog();break;case'editMemory':memoryDialog(a.dataset.mem);break;case'togglePin':{let m=c?.memories.find(m=>m.id===a.dataset.mem);if(m){m.pinned=!m.pinned;await write();render()};break;}case'deleteMemory':{if(!confirm('Delete this memory?'))break;c.memories=c.memories.filter(m=>m.id!==a.dataset.mem);await write();render();break;}case'deleteSummary':{if(!confirm('Delete this summary? The underlying messages remain saved.'))break;c.summaries=c.summaries.filter(s=>s.id!==a.dataset.sum);c.summarizedThrough=c.summaries.length?Math.max(...c.summaries.map(s=>s.to)):0;await write();render();break;}case'deleteCharacter':{if(!confirm('Permanently delete this character, all its chats and memories? Export a backup first.'))break;app.characters=app.characters.filter(x=>x.id!==c.id);app.activeId=app.characters[0]?.id||null;view='chats';await write();closeModal();render();break;}case'backup':backup();break;case'chatExport':chatExport();break;case'send':await send();break;case'retry':await generateReply();break;case'buildMemory':await summarizeBatch(8);break;case'import':await importConversation();break;case'loadModel':await loadModel();break;case'saveEndpoint':{app.settings.endpoint=document.getElementById('endpoint').value.trim();app.settings.apiModel=document.getElementById('apiModel').value.trim();app.settings.apiKey=document.getElementById('apiKey').value;await write();render();alertToast('Endpoint settings saved.');break;}case'restore':document.getElementById('restorefile').click();break;case'clearAll':{if(!confirm('Erase ALL local conversations, characters, and memories? This cannot be undone.'))break;app={version:1,characters:[],activeId:null,settings:{...defaultSettings}};engine=null;view='chats';await write();render();break;} }
}
document.addEventListener('click',e=>handleActions(e).catch(err=>alertToast('Error: '+String(err.message||err))));document.addEventListener('change',async e=>{if(e.target.id==='memchar'){app.activeId=e.target.value;await write();render()}if(e.target.name==='mode'){app.settings.mode=e.target.value;loadMessage='';await write();render()}if(e.target.id==='model'){app.settings.model=e.target.value;await write();if(engine&&engineModel!==app.settings.model){engine=null;loadMessage='Load the newly selected model';}render()}if(e.target.id==='restorefile'){const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(obj.format!=='storyvault-backup')throw Error('Not a StoryVault backup');if(confirm('Restore the backup and replace your current data?'))await restoreBackup(obj);}catch(err){alertToast(String(err.message||err))}}});
document.addEventListener('keydown',e=>{if(e.target.id==='msg'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
async function init(){try{db=await openDb();const saved=await read();if(saved&&Array.isArray(saved.characters)){app={version:1,characters:saved.characters.map(normalizeChar),activeId:saved.activeId,settings:{...defaultSettings,...saved.settings}};if(!app.characters.some(c=>c.id===app.activeId))app.activeId=app.characters[0]?.id||null}}catch(e){alertToast('Could not open browser storage: '+String(e.message||e))}render();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{})}
init();
</script>
</body></html>
